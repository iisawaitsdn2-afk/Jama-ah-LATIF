/* ===== LOGIN (minimalis) ===== */
#login{display:none;position:fixed;inset:0;z-index:100;align-items:center;justify-content:center;padding:24px;overflow:auto;background:radial-gradient(120% 90% at 50% 0%,#17483f 0%,#0f2b30 55%,#0a1c22 100%);color:#E7F0EC}
.lg-glow{position:absolute;border-radius:50%;filter:blur(90px);opacity:0;pointer-events:none;animation:lgFade 2.4s .2s ease forwards}
.lg-glow.g1{width:340px;height:340px;background:#176B61;top:-80px;left:-80px}
.lg-glow.g2{width:300px;height:300px;background:#75AFA0;bottom:-100px;right:-60px;animation-delay:.6s}
.lg-stage{position:relative;width:min(340px,100%);margin:auto;display:flex;flex-direction:column;align-items:center;text-align:center}
.lg-mark{width:96px;height:96px;stroke:#E9DFC4;overflow:visible;filter:drop-shadow(0 0 14px rgba(233,223,196,.18))}
.lg-mark path{stroke-dasharray:1;stroke-dashoffset:1;fill:rgba(233,223,196,0);animation:lgDraw 1.7s cubic-bezier(.65,0,.35,1) forwards,lgFill 1s 1.5s ease forwards}
.lg-mark path:nth-child(2){animation-delay:.25s,1.6s}
.lg-mark path:nth-child(3){animation-delay:.7s,1.9s}
.lg-brand{margin-top:20px;font-size:13px;font-weight:700;letter-spacing:.42em;padding-left:.42em;color:#E9DFC4;opacity:0;animation:lgUp .9s 1.6s ease forwards}
.lg-hello{margin-top:14px;font-size:20px;line-height:1.55;font-weight:300;color:rgba(231,240,236,.85);opacity:0;animation:lgUp 1s 2.1s ease forwards}
.lg-hello b{font-weight:600;color:#fff}
.lg-reveal{display:grid;grid-template-rows:0fr;width:100%;opacity:0;animation:lgOpen 1s 3.1s cubic-bezier(.22,1,.36,1) forwards}
.lg-inner{overflow:hidden;min-height:0}
.lg-form{padding:34px 4px 4px;text-align:left}
.lg-f{position:relative;margin-bottom:18px}
.lg-f input{width:100%;background:transparent;border:0;border-bottom:1px solid rgba(231,240,236,.28);border-radius:0;color:#fff;font-size:16px;padding:20px 34px 8px 0;outline:0;transition:border-color .25s}
.lg-f input:focus{border-color:#E9DFC4}
.lg-f label{position:absolute;left:0;top:20px;font-size:15px;color:rgba(231,240,236,.55);pointer-events:none;transition:.2s ease;transform-origin:left}
.lg-f input:focus+label,.lg-f input:not(:placeholder-shown)+label{top:2px;font-size:11px;letter-spacing:.08em;color:#E9DFC4}
.lg-f input:-webkit-autofill{-webkit-text-fill-color:#fff;transition:background-color 9999s}
.lg-eye{position:absolute;right:0;top:18px;width:28px;height:28px;border:0;background:none;color:rgba(231,240,236,.55);cursor:pointer;padding:3px;transition:color .2s}
.lg-eye:hover{color:#E9DFC4}.lg-eye svg{width:100%;height:100%}.lg-eye .sl{opacity:0}.lg-eye.on .sl{opacity:1}
.lg-btn{width:100%;margin-top:14px;border:0;border-radius:999px;padding:14px;font-size:15px;font-weight:700;letter-spacing:.04em;cursor:pointer;background:#E9DFC4;color:#0f2b30;transition:transform .2s,box-shadow .2s,opacity .2s}
.lg-btn:hover{transform:translateY(-1px);box-shadow:0 10px 26px rgba(233,223,196,.22)}
.lg-btn:active{transform:none;opacity:.9}
#lg-e{color:#ffb4ab;font-size:13px;margin-top:14px;min-height:18px;text-align:center;line-height:1.45}
@keyframes lgDraw{to{stroke-dashoffset:0}}
@keyframes lgFill{to{fill:rgba(233,223,196,.09)}}
@keyframes lgUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes lgFade{to{opacity:.32}}
@keyframes lgOpen{to{grid-template-rows:1fr;opacity:1}}
@media(prefers-reduced-motion:reduce){#login *{animation-duration:.01s!important;animation-delay:0s!important}}

/* ===== TAMPILAN SETELAH LOGIN (minimalis) ===== */
:root{--r:16px;--ring:rgba(23,107,97,.12)}
body{background:var(--bg)!important;font-feature-settings:"tnum"}
[data-t=dark] body{background:#0e1d24!important}
main{max-width:1040px;padding:32px 28px}
.top{margin-bottom:26px}
.top h2{font-size:24px;font-weight:700;letter-spacing:-.01em}
.ib{width:38px;height:38px;border-radius:10px;box-shadow:none;background:var(--solid)}
.ib:hover{border-color:var(--pr);color:var(--pr)}
/* sidebar */
aside{width:236px;padding:20px 14px;gap:4px;box-shadow:none;background:var(--solid)!important}
[data-t=dark] aside{background:#13272f!important}
.logo{display:flex;align-items:center;gap:12px;text-align:left;padding:6px 8px 22px;font-size:15px}
.logo .lm{width:38px;height:38px;border-radius:11px;background:var(--pr);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
[data-t=dark] .logo .lm{background:#75AFA0;color:#0e1d24}
.logo .lt{display:flex;flex-direction:column;line-height:1.15}
.logo .lt b{font-size:15px;letter-spacing:.08em}
.logo .lt small{font-size:11px;letter-spacing:.22em;color:var(--mu);font-weight:600}
.nav{padding:10px 12px;border-radius:10px;font-size:14px;font-weight:600;opacity:.75}
.nav .i{width:18px;height:18px}
.nav:hover{opacity:1;background:var(--soft)}
.nav.on{background:var(--soft)!important;color:var(--pr)!important;box-shadow:none;opacity:1}
[data-t=dark] .nav.on{color:#9fd0c4!important}
.user{border-radius:12px;font-size:12.5px;line-height:1.5;background:transparent;border:1px solid var(--bd)}
.user .mu{font-size:12px}
/* hero */
.hero{border-radius:20px;padding:30px 32px;margin-bottom:20px;background:var(--solid);border:1px solid var(--bd);position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;left:0;top:22px;bottom:22px;width:4px;border-radius:0 4px 4px 0;background:var(--pr)}
.hero .hd{font-size:12.5px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.08em}
.hero h1{font-size:26px;font-weight:700;margin:6px 0 8px;letter-spacing:-.015em}
.hero p{color:var(--mu);max-width:480px;line-height:1.6;font-size:14.5px}
/* kpi */
.g3{gap:14px;margin-bottom:26px}
.card{box-shadow:none;background:var(--solid);border-radius:var(--r);transition:border-color .2s,transform .2s,box-shadow .2s}
.kpi{padding:20px;cursor:pointer;display:block}
.kpi .kt{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.kpi .ico{width:38px;height:38px;border-radius:11px;background:var(--soft);display:grid;place-items:center;color:var(--pr)}
.kpi .ico .i{width:20px;height:20px}
.kpi .chev{color:var(--mu)}.kpi .chev .i{width:16px;height:16px}
.kpi .big{font-size:34px;font-weight:700;line-height:1;letter-spacing:-.02em;color:var(--tx)}
.kpi .mu{margin-top:8px;font-size:13px}
.kpi:hover{border-color:var(--pr);box-shadow:0 8px 22px var(--ring);transform:translateY(-2px)}
.kpi.warn{cursor:default;background:var(--peach);border-color:transparent}
.kpi.warn:hover{transform:none;box-shadow:none}
.kpi.warn .ico{background:rgba(255,255,255,.55);color:#c9722a}
.kpi.warn .big,.kpi.warn .mu{color:var(--peachtx)}
/* akses cepat */
.sec2{font-size:13px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.08em;margin:0 0 12px 2px}
.ql{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.ql button{display:flex;align-items:center;gap:14px;text-align:left;padding:14px 16px;border-radius:var(--r);border:1px solid var(--bd);background:var(--solid);color:var(--tx);cursor:pointer;font:inherit;transition:.2s}
.ql button>.i{width:16px;height:16px;margin-left:auto;color:var(--mu);transition:.2s}
.ql button:hover{border-color:var(--pr);box-shadow:0 6px 18px var(--ring)}
.ql button:hover>.i{color:var(--pr);transform:translateX(3px)}
.ql .ico{width:40px;height:40px;border-radius:11px;background:var(--soft);color:var(--pr);display:grid;place-items:center;flex:none}
.ql .ico .i{width:20px;height:20px}
.ql b{display:block;font-size:14.5px;font-weight:650}
.ql small{display:block;color:var(--mu);font-size:12.5px;margin-top:2px}
/* kartu menu kelas / bulan -> baris ringkas */
.grid{gap:10px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.card.c{flex-direction:row;justify-content:flex-start;gap:12px;text-align:left;padding:16px 18px;font-weight:650;font-size:14.5px;flex-wrap:wrap;position:relative}
.card.c .ci2{width:36px;height:36px;border-radius:10px;background:var(--soft);display:grid;place-items:center;flex:none}
.card.c .ci2 .i{width:18px;height:18px}
.card.c .mu{width:100%;margin:-4px 0 0 48px;font-size:12.5px;font-weight:500}
.card.c .ar{position:absolute;right:16px;top:50%;transform:translateY(-50%);opacity:.5}
.card.c:hover{transform:translateY(-2px);box-shadow:0 8px 22px var(--ring)}
.card.c:has(.mu){align-items:flex-start;row-gap:0}
/* tabel & kontrol */
.tw{border-radius:var(--r);box-shadow:none;background:var(--solid)}
th{background:transparent;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);border-bottom:1px solid var(--bd)}
td{border-bottom:1px solid var(--bd)}
tbody tr:hover td,table tr:not(.tot):hover td{background:var(--soft)}

input,select{border-radius:10px;background:var(--solid)}

 main{padding:18px 16px}

/* ===== ANIMASI HALUS ===== */
html{scroll-behavior:smooth}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes vIn{from{opacity:0;transform:translate(var(--dx,0px),10px)}to{opacity:1;transform:none}}
@keyframes cIn{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
@keyframes dIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes popIn{0%{opacity:0;transform:scale(.6)}60%{transform:scale(1.06)}100%{opacity:1;transform:none}}
@keyframes ringP{0%{box-shadow:0 6px 20px rgba(0,0,0,.25),0 0 0 0 rgba(117,175,160,.55)}100%{box-shadow:0 6px 20px rgba(0,0,0,.25),0 0 0 22px rgba(117,175,160,0)}}
#view.vi{animation:vIn .42s cubic-bezier(.22,1,.36,1)}
#view.vi .grid>*,#view.vi .ql>*,#view.vi .g3>*,#view.vi .hero{animation:cIn .55s cubic-bezier(.22,1,.36,1) backwards;animation-delay:calc(var(--i,0)*45ms)}
.btn,.ib,.qb,.nav,.ql button,.card.c,.kpi{-webkit-tap-highlight-color:transparent}
.btn:active,.ib:active,.qb:active,.nav:active,.ql button:active,.card.c:active,.kpi:active{transform:scale(.96)!important}
aside{transition:transform .38s cubic-bezier(.22,1,.36,1)}
.shade{display:block;opacity:0;pointer-events:none;transition:opacity .3s}
.shade.open{opacity:1;pointer-events:auto}
dialog[open]{animation:dIn .32s cubic-bezier(.22,1,.36,1)}
dialog[open]::backdrop{animation:fadeIn .3s}
.tt,.tt *{transition:background-color .4s,color .4s,border-color .4s,box-shadow .4s!important}
#login{animation:fadeIn .6s ease}
#intro{animation:fadeIn .7s ease}
#intro .card{animation:dIn .9s cubic-bezier(.22,1,.36,1) .1s backwards}
#in-f{animation:popIn 1s cubic-bezier(.22,1,.36,1) .35s backwards,ringP 2.4s ease-out 1.3s infinite}
#in-n{animation:cIn .8s cubic-bezier(.22,1,.36,1) .7s backwards}
#in-j{animation:cIn .8s cubic-bezier(.22,1,.36,1) .85s backwards}
#in-p{animation:cIn .9s cubic-bezier(.22,1,.36,1) 1.1s backwards}
#in-c{animation:fadeIn 1s 1.5s backwards}
#in-b{animation:cIn .6s cubic-bezier(.22,1,.36,1)}
#in-s{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.18)!important;color:#fff!important;border-color:rgba(255,255,255,.3)!important;backdrop-filter:blur(6px)}
@media(prefers-reduced-motion:reduce){#view.vi,#view.vi *,#intro,#intro *,dialog{animation-duration:.01s!important;animation-delay:0s!important}html{scroll-behavior:auto}}

<script>
const KLS=['VII','VIII','IX','X','XI','XII'];
const GR=['X','XI'];
const UN=['VII','VIII','IX','X-WK','X-NW','XI-WK','XI-NW','XI-PL','XII'];
const GN={WK:'WALI KAMAR',NW:'NON WAKA',PL:'PELAKSANA'};
const lbl=u=>{const[a,g]=u.split('-');return 'Kelas '+a+(g?' – '+(GN[g]||g):'')};
const BLN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const P={home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-3.5 3-6 7-6s7 2.5 7 6"/><circle cx="17.5" cy="9" r="2.5"/><path d="M18 14c2.5.3 4 2.2 4 5"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9L7 7M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',school:'<path d="M3 21h18M5 21V9l7-5 7 5v12"/><path d="M9 21v-6h6v6"/>',alert:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/>',bolt:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',chart:'<path d="M5 21V10M12 21V4M19 21v-8"/>',grad:'<path d="M12 4L2 9l10 5 10-5z"/><path d="M6 11.5V16c0 1.5 3 3 6 3s6-1.5 6-3v-4.5"/>',chev:'<path d="M9 6l6 6-6 6"/>',arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',moon:'<path d="M20 14A8 8 0 1110 4a7 7 0 0010 10z"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',back:'<path d="M19 12H5M11 6l-6 6 6 6"/>',menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',plus:'<path d="M12 5v14M5 12h14"/>',list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',out:'<path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/>',refresh:'<path d="M20 11a8 8 0 10-2 6M20 4v7h-7"/>'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let D;
try{D=JSON.parse(localStorage.getItem('kj'))}catch(e){}
D=D||{members:[],records:[],sheet:{},codes:[{k:'TS',ket:'Telat Subuh'},{k:'TD',ket:'Telat Dluha'},{k:'TDRS',ket:''},{k:'TA',ket:'Telat Asar'},{k:'TM',ket:'Telat Maghrib'},{k:'TI',ket:''},{k:'TBM',ket:''},{k:'TBS',ket:''},{k:'A',ket:''}],user:'Pengurus Pondok Pesantren',theme:'dark'};
const save=()=>{if(D.sync)D.sync.dirty=true;try{localStorage.setItem('kj',JSON.stringify(D))}catch(e){alert('Penyimpanan penuh/tidak tersedia')}queueSync()};
D.sheet=D.sheet||{};
D.members.forEach(m=>{if(m.kelas==='X'||m.kelas==='XI')m.kelas+='-NW'});
Object.keys(D.sheet).forEach(q=>{const p=q.split('|');if(p[0]==='X'||p[0]==='XI'){p[0]+='-NW';D.sheet[p.join('|')]=D.sheet[q];delete D.sheet[q]}});

/* ===== SUARA: "ting" + musik intro ===== */
let AC=null,SND=localStorage.getItem('kjsnd')!=='0',ANIM=1,dir=1,MU=null;
function ac(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C()}if(AC.state==='suspended')AC.resume()}catch(e){return null}return AC}
['pointerdown','keydown'].forEach(ev=>addEventListener(ev,()=>ac(),{once:true,passive:true}));
function bell(f,t,d,v){const a=AC;[[1,1],[2.76,.32],[5.4,.1]].forEach(([r,g])=>{const o=a.createOscillator(),n=a.createGain();o.type='sine';o.frequency.value=f*r;
 n.gain.setValueAtTime(.0001,t);n.gain.exponentialRampToValueAtTime(v*g,t+.008);n.gain.exponentialRampToValueAtTime(.0001,t+d/Math.sqrt(r));
 o.connect(n);n.connect(a.destination);o.start(t);o.stop(t+d+.05)})}
function ting(k=0){if(!SND||!ac())return;const t=AC.currentTime+.01;
 if(k===0)bell(1760,t,.8,.11);
 else if(k===1)bell(1318.5,t,.6,.09);
 else{[1046.5,1318.5,1568,2093].forEach((f,i)=>bell(f,t+i*.09,.9,.1))}}
const mid=n=>440*Math.pow(2,(n-69)/12);
function sched(t0,bus){const B=.72,P=[[50,57,62,66],[45,57,61,64],[47,59,62,66],[43,55,59,62]],A=[[74,78,81,78],[73,76,81,76],[74,78,83,78],[71,74,79,74]];
 P.forEach((ch,ci)=>{const tc=t0+ci*4*B,te=tc+4*B;
  ch.forEach(n=>{[['triangle',0],['sine',3]].forEach(([ty,dt])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=mid(n);o.detune.value=dt;
   g.gain.setValueAtTime(.0001,tc);g.gain.exponentialRampToValueAtTime(.05,tc+.7);g.gain.setValueAtTime(.05,te-.2);g.gain.exponentialRampToValueAtTime(.0001,te+.9);
   o.connect(g);g.connect(bus);o.start(tc);o.stop(te+1)})});
  for(let k=0;k<8;k++){const tn=tc+k*B/2,o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=mid(A[ci][k%4]+(k===7?12:0));
   g.gain.setValueAtTime(.0001,tn);g.gain.exponentialRampToValueAtTime(k%4===0?.11:.07,tn+.012);g.gain.exponentialRampToValueAtTime(.0001,tn+1.1);
   o.connect(g);g.connect(bus);o.start(tn);o.stop(tn+1.2)}})}
function startMusic(){if(!SND)return;stopMusic(true);
 if(INTRO.lagu){const el=new Audio(INTRO.lagu);el.loop=true;el.volume=0;el.play().then(()=>{let v=0;const f=setInterval(()=>{v=Math.min(.7,v+.05);el.volume=v;if(v>=.7)clearInterval(f)},120)}).catch(()=>{});MU={el};return}
 const a=ac();if(!a)return;
 const m=a.createGain();m.gain.setValueAtTime(0,a.currentTime);m.gain.linearRampToValueAtTime(.9,a.currentTime+2);m.connect(a.destination);
 const dl=a.createDelay(1);dl.delayTime.value=.36;const fb=a.createGain();fb.gain.value=.38;const wt=a.createGain();wt.gain.value=.45;
 dl.connect(fb);fb.connect(dl);dl.connect(wt);wt.connect(m);
 const bus=a.createGain();bus.connect(m);bus.connect(dl);
 const cyc=16*.72;MU={m,t:a.currentTime+.15};sched(MU.t,bus);MU.t+=cyc;
 MU.iv=setInterval(()=>{if(AC.currentTime>MU.t-3){sched(MU.t,bus);MU.t+=cyc}},1000)}
function stopMusic(now){if(!MU)return;const u=MU;MU=null;clearInterval(u.iv);
 if(u.el){const el=u.el;const f=setInterval(()=>{el.volume=Math.max(0,el.volume-.07);if(el.volume<=.01){clearInterval(f);el.pause()}},80);if(now){el.pause()}return}
 u.m.gain.cancelScheduledValues(AC.currentTime);u.m.gain.setTargetAtTime(0,AC.currentTime,now?.05:.4);setTimeout(()=>{try{u.m.disconnect()}catch(e){}},now?300:2500)}
function sndIcon(){const sv='<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/>'+(SND?'<path d="M15.5 8.5a5 5 0 010 7M19 5a10 10 0 010 14"/>':'<path d="M22 9l-6 6M16 9l6 6"/>')+'</svg>';
 ['snd','in-s'].forEach(i=>{const e=$(i);if(e)e.innerHTML=sv})}
function toggleSnd(){SND=!SND;localStorage.setItem('kjsnd',SND?'1':'0');sndIcon();
 if(SND){ting(0)}else stopMusic()}
function anim(){const v=$('view');v.classList.remove('vi');v.style.setProperty('--dx',(dir*24)+'px');void v.offsetWidth;v.classList.add('vi');
 v.querySelectorAll('.grid>*,.ql>*,.g3>*,.hero').forEach((e,i)=>e.style.setProperty('--i',Math.min(i,14)))}
function hideLogin(){const l=$('login');l.style.transition='opacity .5s ease';l.style.opacity=0;setTimeout(()=>{l.style.display='none';l.style.opacity='';l.style.transition=''},520)}

let stack=[{r:'dash'}];
const cur=()=>stack[stack.length-1];
function go(r,p={}){ting(0);ANIM=1;dir=1;if(S&&!isAd()&&(r==='dash'||(r==='jamaah'&&S.kelas.length===1))){stack=[home()];drawer(0);render();return}
 stack=(r==='dash'||r==='jamaah'||r==='set')&&!p.keep?[{r,...p}]:[...stack,{r,...p}];drawer(0);render()}
function back(){if(stack.length>1){ting(1);ANIM=1;dir=-1;stack.pop();render()}}
function drawer(o){$('sb').classList.toggle('open',!!o);$('shade').classList.toggle('open',!!o)}
function theme(){ting(0);const h=document.documentElement;h.classList.add('tt');setTimeout(()=>h.classList.remove('tt'),500);D.theme=D.theme==='dark'?'light':'dark';save();document.documentElement.dataset.t=D.theme}
function modal(t,html,fn){$('dt').textContent=t;$('db').innerHTML=html;$('frm').onsubmit=e=>{const f=Object.fromEntries(new FormData($('frm')));if(fn(f)===false){e.preventDefault();return}save();render()};dlg.showModal()}
const dlg=$('dlg');
const tok=s=>String(s||'').toUpperCase().split(/[,;\s]+/).map(x=>x.replace(/\./g,'')).filter(Boolean);
const key=(k,b,w,id)=>k+'|'+b+'|'+w+'|'+id;
function setCell(k,b,w,id,el){const v=tok(el.value).join(',');el.value=v;if(v)D.sheet[key(k,b,w,id)]=v;else delete D.sheet[key(k,b,w,id)];save();upd(k,b)}

 ft.forEach((n,w)=>{const e=$('f'+w);if(e)e.textContent=n});const e=$('ft');if(e)e.textContent=ft.reduce((a,x)=>a+x,0)}

const GAS=`// KOMBO JAMA'AH - Sinkron langsung ke sheet kelas (VII, VIII, IX, X-WK, X-NW, XI-WK, XI-NW, XI-PL, XII)

var KELAS = ['VII', 'VIII', 'IX', 'X-WK', 'X-NW', 'XI-WK', 'XI-NW', 'XI-PL', 'XII'];
var BLN = ['JANUARI', 'FEBRUARI', 'MARET', 'APRIL', 'MEI', 'JUNI', 'JULI', 'AGUSTUS', 'SEPTEMBER', 'OKTOBER', 'NOVEMBER', 'DESEMBER'];
var MAXROW = 40;

function out(o) {
  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);
}

function norm(s) { return String(s == null ? '' : s).replace(/\\s+/g, ' ').trim(); }
function nkey(s) { return norm(s).toLowerCase(); }
function tok(s) {
  return String(s || '').toUpperCase().split(/[,; ]+/).map(function (x) { return x.split('.').join(''); }).filter(Boolean);
}

// Cari blok tiap bulan di satu sheet kelas: judul "JANUARI - KELAS VII", lalu baris judul kolom (Nama, Minggu 1..4)
function findBlocks(data) {
  var blocks = {};
  for (var r = 0; r < data.length; r++) {
    var t = String(data[r][0] || '').toUpperCase().trim();
    if (t.indexOf('KELAS') < 0) continue;
    for (var b = 0; b < 12; b++) {
      if (blocks[b] || t.indexOf(BLN[b]) !== 0) continue;
      var h = -1;
      for (var q = r + 1; q <= r + 3 && q < data.length && h < 0; q++) {
        for (var c = 0; c < data[q].length; c++) if (nkey(data[q][c]) === 'nama') { h = q; break; }
      }
      if (h < 0) continue;
      var blk = { nama: -1, wk: [], start: h + 1, n: 0 };
      for (var c2 = 0; c2 < data[h].length; c2++) {
        var ht = nkey(data[h][c2]);
        if (ht === 'nama') blk.nama = c2;
        var mm = /^minggu\\s*([1-4])/.exec(ht);
        if (mm) blk.wk[+mm[1] - 1] = c2;
      }
      while (blk.n < MAXROW && blk.start + blk.n < data.length && /^\\d+$/.test(String(data[blk.start + blk.n][0]).trim())) blk.n++;
      blocks[b] = blk;
    }
  }
  return blocks;
}

function makeId(k, nama, seen) {
  var id = 's-' + k + '-' + (nkey(nama).replace(/[^a-z0-9]+/g, '') || 'x');
  if (seen[id]) { seen[id]++; id += '-' + seen[id]; } else seen[id] = 1;
  return id;
}

// Hanya menyimpan pengaturan (kode pelanggaran & nama pengguna). Data utama ada di sheet kelas.
function readMeta(ss) {
  var sh = ss.getSheetByName('DATA');
  if (!sh || sh.getLastRow() < 1) return {};
  try {
    var txt = sh.getRange(1, 1, sh.getLastRow(), 1).getValues().map(function (r) { return r[0]; }).join('');
    return txt ? JSON.parse(txt) : {};
  } catch (err) { return {}; }
}

function saveMeta(ss, m) {
  var sh = ss.getSheetByName('DATA') || ss.insertSheet('DATA');
  sh.clear();
  sh.getRange(1, 1).setValue(JSON.stringify(m));
  sh.hideSheet();
}

function hashPw(p, salt) {
  return Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256, salt + '|' + p).map(function (b) { return ('0' + (b & 255).toString(16)).slice(-2); }).join('');
}
function usersSheet(ss) {
  var sh = ss.getSheetByName('USERS');
  if (!sh) {
    sh = ss.insertSheet('USERS');
    sh.getRange('A:E').setNumberFormat('@');
    var salt = Utilities.getUuid();
    sh.getRange(1, 1, 2, 5).setValues([['username', 'salt', 'hash', 'role', 'kelas'], ['admin', salt, hashPw('admin123', salt), 'admin', '']]);
    sh.hideSheet();
  }
  return sh;
}
function readUsers(ss) {
  var v = usersSheet(ss).getDataRange().getValues(), a = [];
  for (var i = 1; i < v.length; i++) {
    if (!v[i][0]) continue;
    a.push({ u: String(v[i][0]), salt: String(v[i][1]), hash: String(v[i][2]), role: String(v[i][3]), kelas: String(v[i][4] || '').split(',').filter(Boolean), row: i + 1 });
  }
  return a;
}
function newSession(u) {
  var t = (Utilities.getUuid() + Utilities.getUuid()).split('-').join('');
  var P = PropertiesService.getScriptProperties(), all = P.getProperties();
  for (var k in all) {
    if (k.indexOf('S_') !== 0) continue;
    try { if (JSON.parse(all[k]).exp < Date.now()) P.deleteProperty(k); } catch (err) { P.deleteProperty(k); }
  }
  P.setProperty('S_' + t, JSON.stringify({ u: u, exp: Date.now() + 30 * 86400000 }));
  return t;
}
function whoami(ss, token) {
  if (!token) return null;
  var raw = PropertiesService.getScriptProperties().getProperty('S_' + token);
  if (!raw) return null;
  var s = JSON.parse(raw);
  if (s.exp < Date.now()) return null;
  var us = readUsers(ss);
  for (var i = 0; i < us.length; i++) if (us[i].u === s.u) return us[i];
  return null;
}
function apiLogin(ss, q) {
  var u = nkey(q.u), C = CacheService.getScriptCache(), ck = 'F_' + u, n = +(C.get(ck) || 0);
  if (n >= 5) return out({ ok: false, error: 'Terlalu banyak percobaan salah. Coba lagi 10 menit lagi.' });
  var us = readUsers(ss), me = null;
  for (var i = 0; i < us.length; i++) if (us[i].u === u && us[i].hash === hashPw(String(q.p || ''), us[i].salt)) me = us[i];
  if (!me) { C.put(ck, String(n + 1), 600); return out({ ok: false, error: 'Username atau password salah' }); }
  C.remove(ck);
  return out({ ok: true, token: newSession(me.u), role: me.role, kelas: me.kelas, name: me.u });
}

function doGet(e) { return out({ ok: false, error: 'Akses lewat aplikasi KOMBO (perlu login)' }); }

function doPost(e) {
  var lock = LockService.getScriptLock();
  lock.waitLock(25000);
  try {
    var q = JSON.parse(e.postData.contents) || {};
    var ss = SpreadsheetApp.getActive();
    if (q.act === 'login') return apiLogin(ss, q);
    var me = whoami(ss, q.token);
    if (!me) return out({ ok: false, auth: false, error: 'Sesi habis, silakan masuk lagi' });
    var isAd = me.role === 'admin';
    var allowed = isAd ? KELAS : me.kelas.filter(function (k) { return KELAS.indexOf(k) >= 0; });
    if (q.act === 'pull') return apiPull(ss, allowed);
    if (q.act === 'push') return apiPush(ss, isAd, allowed, q.data || {});
    if (!isAd) return out({ ok: false, error: 'Hanya admin' });
    var us = readUsers(ss);
    if (q.act === 'users') return out({ ok: true, users: us.map(function (x) { return { u: x.u, role: x.role, kelas: x.kelas }; }) });
    var u = nkey(q.u);
    var admins = us.filter(function (x) { return x.role === 'admin'; }).length;
    var ex = null;
    us.forEach(function (x) { if (x.u === u) ex = x; });
    if (q.act === 'saveUser') {
      if (!u) return out({ ok: false, error: 'Username kosong' });
      if (!ex && !q.p) return out({ ok: false, error: 'Password wajib diisi' });
      var role = q.role === 'admin' ? 'admin' : 'kelas';
      if (ex && ex.role === 'admin' && role !== 'admin' && admins <= 1) return out({ ok: false, error: 'Minimal harus ada satu admin' });
      var kelas = (q.kelas || []).filter(function (k) { return KELAS.indexOf(k) >= 0; });
      var salt = ex ? ex.salt : Utilities.getUuid();
      var row = [u, salt, q.p ? hashPw(String(q.p), salt) : ex.hash, role, role === 'admin' ? '' : kelas.join(',')];
      var sh = usersSheet(ss), r = ex ? ex.row : sh.getLastRow() + 1;
      sh.getRange(r, 1, 1, 5).setNumberFormat('@').setValues([row]);
      return out({ ok: true });
    }
    if (q.act === 'delUser') {
      if (!ex) return out({ ok: false, error: 'Pengguna tidak ditemukan' });
      if (ex.u === me.u) return out({ ok: false, error: 'Tidak bisa menghapus akun yang sedang dipakai' });
      if (ex.role === 'admin' && admins <= 1) return out({ ok: false, error: 'Minimal harus ada satu admin' });
      usersSheet(ss).deleteRow(ex.row);
      return out({ ok: true });
    }
    return out({ ok: false, error: 'Aksi tidak dikenal' });
  } catch (err) {
    return out({ ok: false, error: String(err) });
  } finally {
    lock.releaseLock();
  }
}

// Ambil data: hanya kelas yang diizinkan
function apiPull(ss, allowed) {
  var meta = readMeta(ss), members = [], sheet = {}, found = 0;
  allowed.forEach(function (k) {
    var sh = ss.getSheetByName(k);
    if (!sh || sh.getLastRow() < 1) return;
    var data = sh.getDataRange().getValues();
    var blocks = findBlocks(data);
    var jan = blocks[0];
    if (!jan || jan.nama < 0) return;
    found++;
    var seen = {};
    for (var i = 0; i < jan.n; i++) {
      var nama = norm(data[jan.start + i][jan.nama]);
      if (!nama) continue;
      var id = makeId(k, nama, seen);
      members.push({ id: id, nama: nama, kelas: k });
      Object.keys(blocks).forEach(function (b) {
        var bl = blocks[b];
        if (i >= bl.n) return;
        for (var w = 0; w < 4; w++) {
          if (bl.wk[w] === undefined) continue;
          var v = tok(data[bl.start + i][bl.wk[w]]).join(',');
          if (v) sheet[k + '|' + b + '|' + w + '|' + id] = v;
        }
      });
    }
  });
  if (!found) return out({ ok: false, error: 'Sheet kelas dengan tabel JANUARI tidak ditemukan' });
  return out({ ok: true, data: { members: members, codes: meta.codes || null, sheet: sheet } });
}

// Kirim data: hanya kelas yang diizinkan; pengaturan kode hanya dari admin
function apiPush(ss, isAd, allowed, d) {
  if (isAd) saveMeta(ss, { codes: d.codes, user: d.user });
  var warn = writeClasses(ss, d, allowed);
  if (warn.length) return out({ ok: false, error: 'Tersimpan sebagian: ' + warn.join('; ') });
  return out({ ok: true, time: new Date().toISOString() });
}

function writeClasses(ss, d, allowed) {
  var warn = [], byClass = {};
  (d.members || []).forEach(function (m) { (byClass[m.kelas] = byClass[m.kelas] || []).push(m); });
  KELAS.forEach(function (k) {
    if (allowed.indexOf(k) < 0) return;
    var list = (byClass[k] || []).slice().sort(function (a, c) { return a.nama.localeCompare(c.nama); });
    var sh = ss.getSheetByName(k);
    if (!sh) { if (list.length) warn.push('sheet ' + k + ' tidak ada'); return; }
    var data = sh.getDataRange().getValues();
    var blocks = findBlocks(data);
    var jan = blocks[0];
    if (!jan || jan.nama < 0) { warn.push('tabel JANUARI di sheet ' + k + ' tidak ditemukan'); return; }

    // nama -> nomor urut baris (0 = baris pertama tabel); baris kosong dipakai untuk nama baru
    var rowOf = {}, empty = [];
    for (var i = 0; i < jan.n; i++) {
      var nm = norm(data[jan.start + i][jan.nama]);
      if (nm) { if (rowOf[nkey(nm)] === undefined) rowOf[nkey(nm)] = i; } else empty.push(i);
    }
    var mapped = [];
    list.forEach(function (m) {
      var key = nkey(m.nama);
      if (rowOf[key] === undefined) {
        if (!empty.length) { warn.push(m.nama + ' (' + k + ') tidak muat, maksimal ' + MAXROW + ' nama'); return; }
        var ri = empty.shift();
        rowOf[key] = ri;
        sh.getRange(jan.start + ri + 1, jan.nama + 1).setValue(m.nama);
      }
      mapped.push({ id: m.id, row: rowOf[key] });
    });

    Object.keys(blocks).forEach(function (b) {
      var bl = blocks[b];
      for (var w = 0; w < 4; w++) {
        var ci = bl.wk[w];
        if (ci === undefined) continue;
        var col = [], changed = false;
        for (var j = 0; j < bl.n; j++) col.push([data[bl.start + j][ci]]);
        mapped.forEach(function (mp) {
          if (mp.row >= bl.n) return;
          var v = tok(d.sheet && d.sheet[k + '|' + b + '|' + w + '|' + mp.id]).join(',');
          if (String(col[mp.row][0]).trim() !== v) { col[mp.row][0] = v; changed = true; }
        });
        if (changed) sh.getRange(bl.start + 1, ci + 1, bl.n, 1).setValues(col);
      }
    });
  });
  return warn;
}

<div class="row"><button class="btn" onclick="saveSy()">Simpan</button><button class="btn s" onclick="push()">⬆️ Kirim ke Sheets</button><button class="btn s" onclick="pull()">Ambil dari Sheets</button></div>
<p class="mu" id="syst">${esc(syMsg||(y.last?'Terakhir sinkron: '+y.last:'Belum pernah sinkron.'))}</p>
<p class="mu" style="margin-top:10px">Data otomatis terkirim 3 detik setelah ada perubahan dan diambil ulang tiap 1 menit. Akun disimpan di sheet tersembunyi <b>USERS</b> (password di-hash); jangan bagikan akses edit Sheet ke pengurus kelas.</p></div>`}
const mem=id=>D.members.find(m=>m.id===id);
const klsMem=k=>D.members.filter(m=>m.kelas===k).sort((a,b)=>a.nama.localeCompare(b.nama));
const recs=(k,b,w)=>D.records.filter(x=>x.kelas===k&&x.b===b&&(w==null||x.w===w));

function render(){
 document.querySelectorAll('[data-i]').forEach(e=>e.innerHTML=ic(e.dataset.i));
 if(D.themeV!==2){D.theme="dark";D.themeV=2}document.documentElement.dataset.t=D.theme;if(!S){showLogin();return}
 const c=cur();if((c.k&&!canK(c.k))||(c.g&&!canG(c.g))||(c.r==='set'&&!isAd())||(c.r==='dash'&&!isAd())){stack=[home()];return render()}
 document.querySelector('[data-r=set]').style.display=isAd()?'':'none';
 document.querySelector('[data-r=dash]').style.display=isAd()?'':'none';
 document.querySelector('[data-r=jamaah]').style.display=(isAd()||S.kelas.length>1)?'':'none';
 $('usr').innerHTML=esc(S.name)+'<br><span class="mu">'+(isAd()?'Admin':S.kelas.map(lbl).join(', '))+'</span>';
 document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('on',n.dataset.r===(stack[0].r)));
 $('back').style.display=stack.length>1?'':'none';
 const V=views[c.r];const o=V(c);$('ttl').textContent=o[0];$('view').innerHTML=o[1];scrollTo({top:0,behavior:'instant'});sndIcon();if(ANIM){ANIM=0;anim()}
}
const views={
dash(){
 const m=new Date().getMonth();
 const n=Object.entries(D.sheet).reduce((a,[q,v])=>a+(+q.split('|')[1]===m?tok(v).length:0),0);
 const hr=new Date().getHours(),sal=hr<11?'Selamat pagi':hr<15?'Selamat siang':hr<18?'Selamat sore':'Selamat malam';
 const tgl=new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
 return['Dashboard',`<div class="hero"><div><div class="hd">${tgl}</div><h1>${sal}, ${esc(S&&S.name||'Admin')}</h1><p>Kelola data jama'ah dan catatan pelanggaran dengan mudah dan terstruktur.</p></div></div>
 <div class="g3">
 <div class="card kpi" onclick="go('jamaah')"><div class="kt"><span class="ico">${ic('users')}</span><span class="chev">${ic('chev')}</span></div><div class="big">${D.members.length}</div><div class="mu">Total Jama'ah</div></div>
 <div class="card kpi" onclick="go('jamaah')"><div class="kt"><span class="ico">${ic('school')}</span><span class="chev">${ic('chev')}</span></div><div class="big">${KLSV().length}</div><div class="mu">Total Kelas</div></div>
 <div class="card kpi warn"><div class="kt"><span class="ico">${ic('alert')}</span></div><div class="big">${n}</div><div class="mu">Pelanggaran bulan ${BLN[m]}</div></div></div>
 <div class="sec2">Akses Cepat</div>
 <div class="ql">
 <button onclick="go('jamaah')"><span class="ico">${ic('users')}</span><span><b>Kelola Jama'ah</b><small>Daftar kelas &amp; anggota</small></span>${ic('chev')}</button>
 <button onclick="go('jamaah')"><span class="ico">${ic('cal')}</span><span><b>Input Pelanggaran</b><small>Catat per minggu</small></span>${ic('chev')}</button>
 <button onclick="go('jamaah')"><span class="ico">${ic('chart')}</span><span><b>Lihat Rekap</b><small>Ringkasan bulanan</small></span>${ic('chev')}</button>
 ${isAd()?`<button onclick="go('set')"><span class="ico">${ic('settings')}</span><span><b>Pengaturan</b><small>Pengguna, kode &amp; backup</small></span>${ic('chev')}</button>`:`<button onclick="logout()"><span class="ico">${ic('out')}</span><span><b>Keluar</b><small>Akhiri sesi</small></span>${ic('chev')}</button>`}
 </div>`]},
jamaah(){return["Jama'ah",`<div class="grid">${KLSV().map(k=>`<div class="card c" onclick="${GR.includes(k)?`go('grup',{g:'${k}'})`:`go('kelas',{k:'${k}'})`}"><span class="ci2">${ic('grad')}</span><div>Kelas ${k}</div><div class="mu">${D.members.filter(m=>m.kelas===k||m.kelas.startsWith(k+'-')).length} anggota</div><span class="ar">${ic('arrow')}</span></div>`).join('')}</div>`]},
grup(c){return['Kelas '+c.g,`<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(220px,1fr))">${(c.g==='XI'?['WK','NW','PL']:['WK','NW']).filter(t=>canK(c.g+'-'+t)).map(t=>`<div class="card c" onclick="go('kelas',{k:'${c.g}-${t}'})"><span class="ci2">${ic('school')}</span><div>${GN[t]}</div><div class="mu">${klsMem(c.g+'-'+t).length} anggota</div></div>`).join('')}</div>`]},
kelas(c){return[''+lbl(c.k),`<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(220px,1fr))"><div class="card c" onclick="go('bulan',{k:'${c.k}'})"><span class="ci2">${ic('alert')}</span>Pelanggaran</div><div class="card c" onclick="go('anggota',{k:'${c.k}'})"><span class="ci2">${ic('users')}</span>Daftar Anggota</div></div>`]},
bulan(c){return['Pelanggaran – '+lbl(c.k),`<div class="grid">${BLN.map((b,i)=>`<div class="card c" onclick="go('sheet',{k:'${c.k}',b:${i}})"><span class="ci2">${ic('cal')}</span>${b}</div>`).join('')}</div>`]},
sheet(c){
 const L=klsMem(c.k);
 let h=`<div class="row"><button class="btn" onclick="go('rekap',{k:'${c.k}',b:${c.b}})">Rekap Bulanan</button><button class="btn s" onclick="expSheet('${c.k}',${c.b})">Ekspor CSV</button><button class="btn s" onclick="go('anggota',{k:'${c.k}'})">Anggota</button></div><p class="mu" style="margin-bottom:10px">Ketik kode pelanggaran dipisah koma, contoh <b>TDRS,TA,TS</b>. Kolom JUMLAH dihitung otomatis.</p>`;
 const T=BLN[c.b]+' – '+lbl(c.k);
 if(!L.length)return[T,h+'<div class="empty">Belum ada anggota di kelas ini. Tambahkan dulu di Daftar Anggota.</div>'];
 const W=[0,1,2,3];
 h+=`<div class="tw"><table class="sh"><thead><tr><th rowspan="2">NO</th><th rowspan="2">NAMA</th>${W.map(w=>`<th colspan="2" style="text-align:center">MINGGU KE-${w+1}</th>`).join('')}<th rowspan="2">TOTAL</th></tr><tr>${W.map(()=>'<th>PELANGGARAN</th><th>JUMLAH</th>').join('')}</tr></thead><tbody>`;
 L.forEach((m,i)=>{h+=`<tr><td>${i+1}</td><td>${esc(m.nama)}</td>${W.map(w=>{const v=D.sheet[key(c.k,c.b,w,m.id)]||'';return`<td><input class="ci" value="${esc(v)}" onchange="setCell('${c.k}',${c.b},${w},'${m.id}',this)"></td><td class="n" id="j${w}-${m.id}">${tok(v).length||''}</td>`}).join('')}<td class="n" id="t-${m.id}"></td></tr>`});
 h+=`</tbody><tfoot><tr class="tot"><td colspan="2">JUMLAH</td>${W.map(w=>`<td></td><td class="n" id="f${w}"></td>`).join('')}<td class="n" id="ft"></td></tr></tfoot></table></div>`;
 setTimeout(()=>upd(c.k,c.b),0);
 return[T,h]},
rekap(c){
 const t={};
 klsMem(c.k).forEach(m=>[0,1,2,3].forEach(w=>tok(D.sheet[key(c.k,c.b,w,m.id)]).forEach(x=>t[x]=(t[x]||0)+1)));
 const ks=[...new Set([...D.codes.map(q=>q.k),...Object.keys(t)])];
 const all=Object.values(t).reduce((a,b)=>a+b,0);
 return[`Rekap Bulanan – ${BLN[c.b]}`,`<p class="mu" style="margin-bottom:12px">${lbl(c.k)} · gabungan Minggu 1–4 · hanya berdasarkan kode</p><div class="tw"><table><tr><th>Kode Pelanggaran</th><th>Total</th></tr>
 ${ks.map(k=>{const cd=D.codes.find(q=>q.k===k);return`<tr><td>${esc(k)}${cd&&cd.ket?' – '+esc(cd.ket):''}</td><td>${t[k]||0}</td></tr>`}).join('')}
 <tr class="tot"><td>Total Keseluruhan</td><td>${all}</td></tr></table></div>`]},
anggota(c){
 const k=c.k,q=(c.q||'').toLowerCase();
 let L=D.members.filter(m=>(!k||m.kelas===k)&&canK(m.kelas)&&m.nama.toLowerCase().includes(q));
 L.sort((a,b)=>UN.indexOf(a.kelas)-UN.indexOf(b.kelas)||a.nama.localeCompare(b.nama));
 return['Daftar Anggota'+(k?' – '+lbl(k):''),`<div class="row"><input id="q" placeholder="Cari nama..." value="${esc(c.q||'')}" oninput="cur().q=this.value;search()"><button class="btn" onclick="editMem('${k||''}')">${ic('plus')}Tambah</button></div>
 <div class="tw"><table><tr><th>No</th><th>Nama</th><th>Kelas</th><th>Aksi</th></tr>
 ${L.map((m,i)=>`<tr><td>${i+1}</td><td>${esc(m.nama)}</td><td>${lbl(m.kelas).replace('Kelas ','')}</td><td><button class="btn s" onclick="editMem('${k||''}','${m.id}')">${ic('edit')}</button> <button class="btn d" onclick="delMem('${m.id}')">${ic('trash')}</button></td></tr>`).join('')||'<tr><td colspan="4" class="empty">Belum ada anggota.</td></tr>'}</table></div>`]},
set(c){
 const t=c.t||'pengguna';
 const tabs=[['pengguna','Pengguna & Akses'],['kode','Kode Pelanggaran'],['akun','Tampilan'],['simpan','Penyimpanan'],['backup','Backup & Ekspor'],['sheets','Google Sheets']];
 let b='';
 if(t==='pengguna'){b='<div id="ulist" class="mu">Memuat...</div>';setTimeout(loadUsers,0)}
 if(t==='kode')b=`<div class="row"><button class="btn" onclick="editCode()">${ic('plus')}Tambah Kode</button></div><div class="tw"><table><tr><th>Kode</th><th>Keterangan</th><th>Aksi</th></tr>${D.codes.map((q,i)=>`<tr><td>${esc(q.k)}</td><td>${esc(q.ket)}</td><td><button class="btn s" onclick="editCode(${i})">${ic('edit')}</button> <button class="btn d" onclick="delCode(${i})">${ic('trash')}</button></td></tr>`).join('')}</table></div>`;
 if(t==='akun')b=`<div class="card"><p class="mu">Tema</p><div class="row" style="margin-top:8px"><button class="btn s" onclick="D.theme='light';save();render()">Terang</button><button class="btn s" onclick="D.theme='dark';save();render()">Gelap</button></div></div>`;
 if(t==='simpan')b=`<div class="card"><p>Data tersimpan di perangkat ini (browser), tanpa server.</p><p class="mu" style="margin-top:8px">${D.members.length} anggota · ${D.records.length} catatan · ${(JSON.stringify(D).length/1024).toFixed(1)} KB</p><p class="mu" style="margin-top:8px">Data tidak otomatis sinkron antar perangkat. Gunakan Backup untuk memindahkan data.</p></div>`;
 if(t==='backup')b=`<div class="card"><div class="row"><button class="btn" onclick="exp()">Ekspor Backup (JSON)</button><button class="btn s" onclick="expCsv()">Ekspor Pelanggaran (CSV)</button></div><p class="mu" style="margin:8px 0">Pulihkan dari file backup:</p><input type="file" accept=".json" onchange="imp(this.files[0])"></div>`;
 if(t==='sheets')b=sheetsUI();
 return['Pengaturan',`<div class="tabs">${tabs.map(x=>`<button class="btn ${x[0]===t?'':'s'}" onclick="cur().t='${x[0]}';render()">${x[1]}</button>`).join('')}</div>${b}`]}
};
function search(){const c=cur(),q=(c.q||'').toLowerCase();const el=$('q');const p=el.selectionStart;const o=views.anggota(c);$('view').innerHTML=o[1];const n=$('q');n.focus();n.setSelectionRange(p,p)}
function editRec(k,b,w,id){
 const x=id?D.records.find(r=>r.id===id):{};const L=klsMem(k);
 if(!L.length){alert('Tambahkan anggota kelas '+k+' dahulu di Daftar Anggota.');return}
 modal(id?'Edit Catatan':'Tambah Catatan',`<label>Nama</label><select name="m">${L.map(m=>`<option value="${m.id}" ${m.id===x.m?'selected':''}>${esc(m.nama)}</option>`).join('')}</select><label>Pelanggaran</label><select name="kode">${D.codes.map(q=>`<option value="${esc(q.k)}" ${q.k===x.kode?'selected':''}>${esc(q.k)} – ${esc(q.ket)}</option>`).join('')}</select><label>Total</label><input name="total" type="number" min="1" value="${x.total||1}">`,f=>{
  const t=Math.max(1,parseInt(f.total)||1);
  if(id)Object.assign(x,{m:f.m,kode:f.kode,total:t});else D.records.push({id:uid(),kelas:k,b,w,m:f.m,kode:f.kode,total:t})})}
function delRec(id){if(confirm('Hapus catatan ini?')){D.records=D.records.filter(r=>r.id!==id);save();render()}}
function editMem(k,id){
 const x=id?mem(id):{};
 modal(id?'Edit Anggota':'Tambah Anggota',`<label>Nama</label><input name="nama" required value="${esc(x.nama||'')}"><label>Kelas</label><select name="kelas">${UN.filter(canK).map(q=>`<option value="${q}" ${q===(x.kelas||k)?'selected':''}>${lbl(q)}</option>`).join('')}</select>`,f=>{
  if(!f.nama.trim())return false;
  if(id)Object.assign(x,{nama:f.nama.trim(),kelas:f.kelas});else D.members.push({id:uid(),nama:f.nama.trim(),kelas:f.kelas})})}
function delMem(id){if(confirm('Hapus anggota? Catatan pelanggarannya juga ikut terhapus.')){D.members=D.members.filter(m=>m.id!==id);Object.keys(D.sheet).forEach(q=>{if(q.split('|')[3]===id)delete D.sheet[q]});save();render()}}
function editCode(i){
 const x=i==null?{}:D.codes[i];
 modal(i==null?'Tambah Kode':'Edit Kode',`<label>Kode</label><input name="k" required value="${esc(x.k||'')}" maxlength="6"><label>Keterangan</label><input name="ket" required value="${esc(x.ket||'')}">`,f=>{
  const k=f.k.trim();if(!k||D.codes.some((q,j)=>q.k===k&&j!==i)){alert('Kode kosong atau sudah dipakai');return false}
  if(i!=null)D.records.forEach(r=>{if(r.kode===x.k)r.kode=k});
  const o={k,ket:f.ket.trim()};i==null?D.codes.push(o):D.codes[i]=o})}
function delCode(i){if(confirm('Hapus kode ini?')){D.codes.splice(i,1);save();render()}}
function dl(name,txt,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click()}
function exp(){dl('kombo-jamaah-backup.json',JSON.stringify(D),'application/json')}
function expCsv(){
 const r=['Kelas,Bulan,Minggu,Nama,Kode,Total',...D.records.map(x=>[x.kelas,BLN[x.b],x.w+1,'"'+(mem(x.m)?.nama||'').replace(/"/g,'""')+'"',x.kode,x.total].join(','))];
 dl('pelanggaran.csv',r.join('\n'),'text/csv')}
function imp(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.members||!j.records||!j.codes)throw 0;if(confirm('Timpa semua data saat ini dengan backup?')){D=j;save();render()}}catch(e){alert('File backup tidak valid')}};r.readAsText(f)}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
render();
autoPull();
</script>
</body>
</html>
